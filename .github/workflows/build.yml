name: Build APK

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # SHA-256 сертификата SonnikToPower: все приложения экосистемы подписаны одним ключом.
  ECOSYSTEM_CERT_SHA256: 0f057701a7946499a2b97891744a4ced2ad8f6adaea70494cd5a809e5e6ef650

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::Секреты SIGNING_* не заданы: APK подписан отладочным ключом и не установится рядом с SonnikToPower и Крепостью (INSTALL_FAILED_DUPLICATE_PERMISSION)."
            exit 0
          fi
          # Пробелы и переводы строк (в том числе \r при копировании из Windows) base64 не мешают.
          if ! printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/sonnik.keystore" 2> "$RUNNER_TEMP/b64.err"; then
            echo "::error::SIGNING_KEYSTORE_BASE64 не декодируется как base64 (длина ${#SIGNING_KEYSTORE_BASE64}): $(head -c 200 "$RUNNER_TEMP/b64.err")"
            exit 1
          fi
          echo "::notice::Хранилище ключей: $(stat -c %s "$RUNNER_TEMP/sonnik.keystore") байт."
          if ! keytool -list -keystore "$RUNNER_TEMP/sonnik.keystore" -storepass "$SIGNING_STORE_PASSWORD" > "$RUNNER_TEMP/keytool.out" 2>&1; then
            echo "::error::keytool не открыл хранилище (неверный SIGNING_STORE_PASSWORD или файл): $(grep -m1 -i 'error\|exception' "$RUNNER_TEMP/keytool.out" | head -c 200)"
            exit 1
          fi
          echo "::notice::Псевдонимы в хранилище: $(grep -i 'entry' "$RUNNER_TEMP/keytool.out" | cut -d, -f1 | tr '\n' ' ')"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/sonnik.keystore" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Скриншоты экранов — только при ручном запуске сборки.
          SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build-output.txt

      # Логи прогона не всегда доступны снаружи, а аннотации — да: выносим в них причину падения.
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|Exception:|expected:|What went wrong" -A2 build-output.txt \
            | grep -v "^--$" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          find app/build/test-results -name "*.xml" 2>/dev/null | xargs -r grep -h -A3 "<failure" | head -30 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Commit screenshots
        if: always() && github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          COUNT=$(ls app/build/screenshots/*.png 2>/dev/null | wc -l)
          echo "::notice::Скриншотов: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            mkdir -p docs/screenshots && cp app/build/screenshots/*.png docs/screenshots/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots
            if git commit -m "Скриншоты экранов (сборка ${{ github.run_number }})"; then
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push || echo "::warning::Не удалось отправить скриншоты"
            else
              echo "::notice::Скриншоты не изменились"
            fi
          fi

      - name: Rename APK
        run: |
          VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release*.apk "dist/Pin-$VERSION.apk"
          awk '/^## /{n++} n==1' changelog/changelog_ru.md > release-notes.md

      # Сертификат APK должен совпадать с SonnikToPower, иначе Крепость не увидит данные задач.
      - name: Check signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs dist/Pin-*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Сертификат APK: $ACTUAL"
          echo "::notice::SHA-256 сертификата: $ACTUAL"
          if [ "$ACTUAL" = "$ECOSYSTEM_CERT_SHA256" ]; then
            echo "::notice::Сертификат совпадает с SonnikToPower."
          elif [ -n "$SIGNING_STORE_FILE" ]; then
            echo "::error::Сертификат не совпадает с SonnikToPower ($ECOSYSTEM_CERT_SHA256)."
            exit 1
          else
            echo "::warning::Отладочная подпись: сертификат не совпадает с SonnikToPower."
          fi
          # SHA-1 нужен для OAuth-клиента Google (этап 0.6).
          "$APKSIGNER" verify --print-certs dist/Pin-*.apk | grep -m1 'SHA-1 digest' | sed 's/^/::notice::/'

      - name: Require signing for release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNING_STORE_FILE == ''
        run: |
          echo "::error::Релиз не опубликован: добавьте секреты SIGNING_* в настройках репозитория (те же, что в SonnikToPoer и Garnizon)."
          exit 1

      # Релиз только с общим ключом: APK с отладочной подписью не встанет рядом с остальными приложениями.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNING_STORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Pin ${{ env.APP_VERSION }}
          body_path: release-notes.md
          files: dist/*.apk
          make_latest: true
